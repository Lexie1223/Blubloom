<!doctype html><html><meta charset="utf-8"><title>Ocean Background Preview</title><style>html,body{margin:0;height:100%;background:#073a52;overflow:hidden}img{position:absolute;width:100%;height:100%;object-fit:cover}#front{opacity:0}.note{position:absolute;bottom:16px;left:16px;color:white;font:14px sans-serif;text-shadow:0 1px 4px black}</style><img id="back"><img id="front"><div class="note">背景预览 · 6秒停留 + 2秒淡化 · 1 → 2 → 3 → 4 → 3 → 2</div><script>
const paths=["Assets/OceanStartBackground/Textures/01_Clean.jpeg", "Assets/OceanStartBackground/Textures/02_LightPollution.jpeg", "Assets/OceanStartBackground/Textures/03_Polluted.jpeg", "Assets/OceanStartBackground/Textures/04_HeavyPollution.jpeg"];paths.forEach(p=>{const im=new Image();im.src=p});const seq=[0,1,2,3,2,1];const a=document.getElementById('back'),b=document.getElementById('front');let start=performance.now();function render(now){let t=(now-start)/1000,i=Math.floor(t/8)%seq.length,u=t%8; a.src=paths[seq[i]]; b.src=paths[seq[(i+1)%seq.length]];let f=Math.max(0,Math.min(1,(u-6)/2));b.style.opacity=f*f*(3-2*f);let x=50+17.5*Math.sin(t*2*Math.PI/28);a.style.objectPosition=b.style.objectPosition=x+'% 50%';requestAnimationFrame(render)}requestAnimationFrame(render);
</script></html>
